<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0b0f"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Video Call"
  >

  <title>Video Call</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icon.svg"
    type="image/svg+xml"
  >
  <link
  rel="apple-touch-icon"
  href="icon-192.png"
>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<main class="app">

  <!-- =========================
       START
  ========================== -->

  <section
    id="startScreen"
    class="screen"
  >

    <div class="logo">
      📹
    </div>

    <h1>
      Video Call
    </h1>

    <p class="subtitle">
      Защищённый видеозвонок через WebRTC
    </p>

    <div class="card">

      <button
        id="startButton"
        class="primary-button"
      >
        🎥 Создать звонок
      </button>

      <div class="divider">
        <span>или</span>
      </div>

      <input
        id="remoteIdInput"
        type="text"
        maxlength="8"
        placeholder="Введите код звонка"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >

      <button
        id="joinButton"
        class="secondary-button"
      >
        📞 Подключиться
      </button>

    </div>

    <div
      id="startStatus"
      class="status"
    ></div>

  </section>


  <!-- =========================
       CALL
  ========================== -->

  <section
    id="callScreen"
    class="screen hidden"
  >

    <div class="video-area">

      <!-- REMOTE -->

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div
        id="remotePlaceholder"
        class="video-placeholder"
      >

        <div class="placeholder-icon">
          👤
        </div>

        <div id="remotePlaceholderText">
          Ожидание собеседника...
        </div>

      </div>


      <!-- LOCAL -->

      <div class="local-video-container">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div
          id="localPlaceholder"
          class="local-placeholder"
        >
          📷
        </div>

      </div>


      <!-- TOP -->

      <div class="call-top">

        <div>

          <div class="call-title">
            Video Call
          </div>

          <div
            id="connectionStatus"
            class="connection-status"
          >
            Подключение...
          </div>

        </div>

        <button
          id="copyIdButton"
          class="small-button"
        >
          🔗 Код
        </button>

      </div>


      <!-- CONTROLS -->

      <div class="controls">

        <button
          id="micButton"
          class="control-button"
          type="button"
          aria-label="Микрофон"
        >
          🎙️
        </button>

        <button
          id="cameraButton"
          class="control-button"
          type="button"
          aria-label="Камера"
        >
          📷
        </button>

        <button
          id="switchCameraButton"
          class="control-button"
          type="button"
          aria-label="Перевернуть камеру"
        >
          🔄
        </button>

        <button
          id="hangupButton"
          class="control-button hangup"
          type="button"
          aria-label="Завершить звонок"
        >
          📞
        </button>

      </div>

    </div>


    <!-- ROOM CODE -->

    <div class="my-id-panel">

      <div class="my-id-label">
        Код звонка
      </div>

      <div class="my-id-row">

        <code id="myPeerId">
          Создание...
        </code>

        <button
          id="copyMyIdButton"
          class="copy-button"
          type="button"
        >
          Копировать
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       INCOMING
  ========================== -->

  <div
    id="incomingCall"
    class="incoming hidden"
  >

    <div class="incoming-card">

      <div class="incoming-icon">
        📞
      </div>

      <h2>
        Входящий звонок
      </h2>

      <p>
        Собеседник хочет подключиться
      </p>

      <div class="incoming-buttons">

        <button
          id="acceptCallButton"
          class="accept-button"
          type="button"
        >
          ✓ Принять
        </button>

        <button
          id="rejectCallButton"
          class="reject-button"
          type="button"
        >
          ✕ Отклонить
        </button>

      </div>

    </div>

  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast hidden"
  ></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="client.js"></script>

</body>

</html>
